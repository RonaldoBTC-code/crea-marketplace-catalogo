  <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>CREA Alfombras & Pisos — Catálogo Marketplace</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#14161B;
  --surface:#1C1F26;
  --surface-soft:#23262E;
  --surface-soft-2:#2A2E37;
  --line:#2E323B;
  --line-soft:#3C414C;
  --text:#ECE7DC;
  --text-dim:#A7AEB8;
  --text-faint:#6E7480;

  --cat-textil:#CC8552;
  --cat-agua:#5D8CB3;
  --cat-verde:#7C9A63;
  --cat-tecnico:#9098A3;
  --cat-servicio:#D1A24A;

  --font-display:'Big Shoulders Display', Impact, 'Arial Narrow Bold', sans-serif;
  --font-body:'IBM Plex Sans', -apple-system, 'Segoe UI', Arial, sans-serif;
  --font-mono:'IBM Plex Mono', 'Courier New', monospace;

  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:20px;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
}

body{
  margin:0;
  font-family:var(--font-body);
  background-color:var(--bg);
  color:var(--text);
  padding:0 0 80px;
  background-image:
    repeating-linear-gradient(45deg, rgba(255,255,255,0.022) 0 1px, transparent 1px 27px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,0.018) 0 1px, transparent 1px 27px);
  background-attachment:fixed;
}

::selection{ background:var(--cat-servicio); color:#1A1604; }

/* ---------- HEADER ---------- */
header{
  padding:38px 20px 28px;
  text-align:center;
  border-bottom:1px solid var(--line);
  position:relative;
}
.brand-box{
  display:inline-block;
  border:2px solid var(--text);
  border-radius:6px;
  padding:8px 20px;
  font-family:var(--font-display);
  font-weight:800;
  font-size:30px;
  letter-spacing:2px;
  color:var(--text);
}
.brand-sub{
  margin-top:12px;
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:4px;
  text-transform:uppercase;
  color:var(--text-dim);
}
.brand-tag{
  margin-top:4px;
  font-size:13px;
  color:var(--text-faint);
}

/* ---------- TOOLBAR ---------- */
.toolbar-wrap{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(20,22,27,0.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:14px 20px;
}
.toolbar{
  max-width:900px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.search-wrap{
  position:relative;
  display:flex;
  align-items:center;
}
.search-wrap svg{
  position:absolute;
  left:12px;
  width:16px;
  height:16px;
  color:var(--text-faint);
  pointer-events:none;
}
#search{
  width:100%;
  background:var(--surface-soft);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:var(--radius-sm);
  padding:10px 12px 10px 36px;
  font-size:14px;
  font-family:var(--font-body);
}
#search:focus{ outline:none; border-color:var(--cat-servicio); }
#search::placeholder{ color:var(--text-faint); }

.filter-pills{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}
.pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:var(--surface-soft);
  border:1px solid var(--line);
  color:var(--text-dim);
  padding:6px 12px;
  border-radius:20px;
  font-size:12.5px;
  font-family:var(--font-body);
  font-weight:500;
  cursor:pointer;
  transition:border-color .15s, color .15s, background .15s;
}
.pill .dot{
  width:7px; height:7px; border-radius:50%; flex-shrink:0;
}
.pill .pill-count{
  color:var(--text-faint);
  font-family:var(--font-mono);
  font-size:11px;
}
.pill:hover{ border-color:var(--line-soft); color:var(--text); }
.pill.active{
  background:var(--surface-soft-2);
  border-color:var(--pill-color, var(--cat-servicio));
  color:var(--text);
}
.result-count{
  font-size:12px;
  color:var(--text-faint);
  font-family:var(--font-mono);
}

/* ---------- LAYOUT ---------- */
.container{
  max-width:900px;
  margin:0 auto;
  padding:28px 20px 0;
}

.cat-section{ margin-bottom:8px; }
.cat-section.hidden{ display:none; }
.cat-divider{
  --accent:var(--cat-servicio);
  display:flex;
  align-items:center;
  gap:10px;
  margin:36px 0 18px;
}
.cat-section:first-child .cat-divider{ margin-top:6px; }
.cat-icon{
  width:22px; height:22px;
  color:var(--accent);
  flex-shrink:0;
}
.cat-icon svg{ width:100%; height:100%; }
.cat-divider h2{
  margin:0;
  font-family:var(--font-display);
  font-weight:700;
  font-size:20px;
  letter-spacing:0.5px;
  text-transform:uppercase;
  color:var(--text);
  white-space:nowrap;
}
.cat-count{
  font-family:var(--font-mono);
  font-size:12px;
  color:var(--accent);
  background:color-mix(in srgb, var(--accent) 16%, transparent);
  padding:2px 8px;
  border-radius:10px;
  flex-shrink:0;
}
.cat-line{
  height:1px;
  flex:1;
  background:linear-gradient(to right, var(--line-soft), transparent);
}

/* ---------- CARD ---------- */
.pub{
  display:flex;
  flex-direction:column;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  margin-bottom:20px;
  overflow:hidden;
  scroll-margin-top:130px;
}
.pub-thumb{
  width:100%;
  height:190px;
  flex-shrink:0;
  overflow:hidden;
  background:var(--surface-soft);
  border-bottom:1px solid var(--line);
}
.pub-thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.pub-thumb-empty{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  color:var(--text-faint);
  font-size:12px;
  letter-spacing:.5px;
}
.pub-thumb-empty .eyebrow-icon{ opacity:.5; }
.pub.hidden{ display:none; }
@media (prefers-reduced-motion: no-preference){
  .pub{ animation:riseIn .45s ease both; animation-delay:calc(var(--i,0) * 35ms); }
}
@keyframes riseIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

.pub-accent{ width:100%; height:4px; flex-shrink:0; background:var(--accent); }
.pub-inner{ padding:22px 24px 24px; flex:1; min-width:0; }

.pub-eyebrow{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
  flex-wrap:wrap;
}
.eyebrow-icon{ width:16px; height:16px; color:var(--accent); flex-shrink:0; }
.eyebrow-icon svg{ width:100%; height:100%; }
.eyebrow-label{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--accent);
}
.eyebrow-ref{
  margin-left:auto;
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--text-faint);
  background:var(--surface-soft);
  border:1px solid var(--line);
  padding:2px 8px;
  border-radius:6px;
}

.pub-title-text{
  margin:0 0 16px;
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(20px, 3vw, 25px);
  line-height:1.15;
  color:var(--text);
  letter-spacing:0.2px;
}

/* ---------- META ROW: price tag + spec list ---------- */
.pub-meta{
  display:flex;
  align-items:stretch;
  gap:16px;
  flex-wrap:wrap;
  margin-bottom:20px;
  padding-bottom:20px;
  border-bottom:1px dashed var(--line);
}
.price-tag{
  position:relative;
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:9px 16px 9px 20px;
  clip-path:polygon(12px 0, 100% 0, 100% 100%, 12px 100%, 0 50%);
  background:var(--accent);
  color:#16140C;
  font-family:var(--font-mono);
  flex-shrink:0;
}
.price-tag::before{
  content:'';
  position:absolute;
  left:6px; top:50%;
  width:4px; height:4px;
  background:var(--surface);
  border-radius:50%;
  transform:translateY(-50%);
}
.price-tag .price-cur{ font-size:13px; font-weight:600; opacity:0.75; }
.price-tag .price-num{ font-size:19px; font-weight:600; }
.price-tag.ready .icon-copy-btn{
  background:rgba(22,20,12,0.18);
  border:none;
  color:#16140C;
  width:22px; height:22px;
  border-radius:50%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  margin-left:4px;
  flex-shrink:0;
}
.price-tag.ready .icon-copy-btn:hover{ background:rgba(22,20,12,0.3); }
.price-tag.ready .icon-copy-btn svg{ width:12px; height:12px; }

.price-tag.pending{
  background:transparent;
  border:1.5px dashed var(--accent);
  color:var(--accent);
  clip-path:none;
  border-radius:var(--radius-sm);
  padding:8px 14px;
}
.price-tag.pending::before{ display:none; }
.price-tag.pending .price-pending-label{
  font-size:11.5px;
  letter-spacing:0.5px;
  text-transform:uppercase;
  font-weight:600;
}

.spec-list{
  margin:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:6px;
  font-size:13px;
  flex:1;
  min-width:180px;
}
.spec-list .spec-row{ display:flex; gap:8px; }
.spec-list dt{
  font-family:var(--font-mono);
  font-size:10.5px;
  letter-spacing:0.5px;
  text-transform:uppercase;
  color:var(--text-faint);
  min-width:74px;
  flex-shrink:0;
  padding-top:1px;
}
.spec-list dd{ margin:0; color:var(--text-dim); }

/* ---------- FIELDS ---------- */
.field{ margin-bottom:18px; }
.field-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:7px;
}
.field-head span{
  font-size:11.5px;
  font-weight:600;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--text-faint);
}
.btn-copy{
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:var(--surface-soft);
  border:1px solid var(--line);
  color:var(--text-dim);
  padding:5px 11px;
  border-radius:7px;
  font-size:11.5px;
  font-weight:600;
  font-family:var(--font-body);
  cursor:pointer;
  transition:border-color .15s, color .15s, transform .1s;
}
.btn-copy svg{ width:12px; height:12px; }
.btn-copy:hover{ border-color:var(--accent); color:var(--text); }
.btn-copy:active{ transform:scale(0.96); }
.btn-copy.copied{ border-color:var(--accent); color:var(--accent); }

.value-block{
  background:var(--surface-soft);
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  padding:11px 14px;
  font-size:14px;
  line-height:1.5;
  color:var(--text);
}
.titulo-block{ font-weight:500; }
.desc-block{
  white-space:normal;
  line-height:1.75;
  cursor:text;
  user-select:text;
}
.desc-block:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

.chip-wrap{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}
.chip{
  font-size:12px;
  padding:4px 11px;
  border-radius:20px;
  background:var(--surface-soft);
  border:1px solid var(--line);
  color:var(--text-dim);
}

.sku-rows{ display:flex; flex-direction:column; gap:6px; }
.sku-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  background:var(--surface-soft);
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  padding:9px 10px 9px 12px;
}
.sku-code{
  font-family:var(--font-mono);
  font-size:13px;
  color:var(--text);
  word-break:break-word;
}
.icon-copy-btn{
  background:var(--surface-soft-2);
  border:1px solid var(--line);
  color:var(--text-dim);
  width:28px; height:28px;
  border-radius:7px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex-shrink:0;
  transition:border-color .15s, color .15s;
}
.icon-copy-btn svg{ width:13px; height:13px; }
.icon-copy-btn:hover{ border-color:var(--accent); color:var(--text); }
.icon-copy-btn.copied{ border-color:var(--accent); color:var(--accent); }

/* ---------- TIP ---------- */
.tip-note{
  --accent:var(--cat-servicio);
  position:relative;
  background:var(--surface-soft);
  border:1px solid var(--line);
  border-left:3px solid var(--accent);
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  padding:11px 14px 11px 16px;
  margin-top:4px;
}
.tip-note p{
  margin:0;
  font-size:12.5px;
  color:var(--text-dim);
  line-height:1.6;
}
.tip-note strong{ color:var(--accent); font-family:var(--font-mono); font-size:11px; letter-spacing:0.5px; text-transform:uppercase; }

/* ---------- BACK TO TOP ---------- */
.to-top{
  position:fixed;
  right:20px;
  bottom:24px;
  width:46px; height:46px;
  border-radius:50%;
  background:var(--surface-soft-2);
  border:1px solid var(--line-soft);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s, transform .15s, border-color .15s;
  z-index:60;
}
.to-top svg{ width:18px; height:18px; }
.to-top.show{ opacity:1; pointer-events:auto; }
.to-top:hover{ transform:translateY(-3px); border-color:var(--cat-servicio); }

/* ---------- TOAST ---------- */
#toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--cat-servicio);
  color:#1A1604;
  padding:10px 22px;
  border-radius:8px;
  font-size:13.5px;
  font-weight:600;
  font-family:var(--font-body);
  opacity:0;
  transition:.22s;
  pointer-events:none;
  z-index:999;
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

/* ---------- FOOTER ---------- */
footer{
  max-width:900px;
  margin:40px auto 0;
  padding:20px;
  text-align:center;
  color:var(--text-faint);
  font-size:12px;
  border-top:1px solid var(--line);
}

/* ---------- RESPONSIVE ---------- */
@media (max-width:640px){
  header{ padding:28px 16px 22px; }
  .brand-box{ font-size:24px; padding:6px 14px; }
  .container{ padding:22px 14px 0; }
  .pub-inner{ padding:18px 16px 20px; }
  .cat-divider h2{ font-size:17px; }
  .pub-meta{ flex-direction:column; align-items:flex-start; }
  .spec-list{ min-width:0; width:100%; }
  .eyebrow-ref{ margin-left:0; }
}
</style>
</head>

/* ---------------- HELPERS ---------------- */
function esc(str){
  return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
}
function isPriceReady(precio){
  return /^\d+(\.\d+)?$/.test(String(precio).trim());
}
function slug(str){
  return String(str).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

    }).join('');

    const thumbHtml = p.foto
      ? `<div class="pub-thumb"><img src="${esc(p.foto)}" alt="${esc(p.name)}" loading="lazy"></div>`
      : `<div class="pub-thumb pub-thumb-empty"><span class="eyebrow-icon">${ICONS[p.cat]}</span><span>Sin imagen aún</span></div>`;

    cardsHtml += `
    <article class="pub" id="${id}" data-cat="${p.cat}" data-name="${esc(p.name).toLowerCase()} ${esc(p.titulo).toLowerCase()}" style="--accent:${meta.color}; --i:${globalIndex};">
      <div class="pub-accent"></div>
      ${thumbHtml}
      <div class="pub-inner">
        <div class="pub-eyebrow">
          <span class="eyebrow-icon">${ICONS[p.cat]}</span>
          <span class="eyebrow-label">${meta.label}</span>
          <span class="eyebrow-ref">REF. ${esc(p.ref)}</span>
        </div>
        <h3 class="pub-title-text">${esc(p.name)}</h3>

        <div class="pub-meta">
          ${priceHtml}
          <dl class="spec-list">
            <div class="spec-row"><dt>Categoría</dt><dd>${esc(p.categoria)}</dd></div>
            <div class="spec-row"><dt>Estado</dt><dd>${esc(p.estado)}</dd></div>
          </dl>
        </div>

        <div class="field">
          <div class="field-head"><span>Título</span><button class="btn-copy" data-copy="${encodeURIComponent(p.titulo)}">${COPY_ICON} Copiar</button></div>
          <div class="value-block titulo-block">${esc(p.titulo)}</div>
        </div>

        <div class="field">
          <div class="field-head"><span>Descripción</span><button class="btn-copy" data-copy="${encodeURIComponent(descRaw)}">${COPY_ICON} Copiar</button></div>
          <div class="value-block desc-block copyable" tabindex="0">${descHtml}</div>
        </div>

        <div class="field">
          <div class="field-head"><span>Etiquetas de producto</span><button class="btn-copy" data-copy="${encodeURIComponent(tagsRaw)}">${COPY_ICON} Copiar todas</button></div>
          <div class="chip-wrap">${tagsHtml}</div>
        </div>

        <div class="field" style="margin-bottom:14px;">
          <div class="field-head"><span>SKU</span></div>
          <div class="sku-rows">${skuHtml}</div>
        </div>

        <div class="tip-note">
          <p><strong>Tip</strong> — ${esc(p.tip)}</p>
        </div>
      </div>
    </article>`;
    globalIndex++;
  });

  sectionsHtml += `
  <section class="cat-section" data-cat="${catKey}">
    <div class="cat-divider" style="--accent:${meta.color}">
      <span class="cat-icon">${ICONS[catKey]}</span>
      <h2>${meta.label}</h2>
      <span class="cat-count">${items.length}</span>
      <span class="cat-line"></span>
    </div>
    ${cardsHtml}
  </section>`;
});

containerEl.innerHTML = sectionsHtml;

/* ---------------- FILTERING ---------------- */
const searchInput = document.getElementById('search');
const resultCountEl = document.getElementById('resultCount');
let activeCat = 'all';

function applyFilters(){
  const q = searchInput.value.trim().toLowerCase();
  let totalVisible = 0;
  document.querySelectorAll('.cat-section').forEach(sec => {
    let visibleInSection = 0;
    sec.querySelectorAll('.pub').forEach(card => {
      const matchesCat = activeCat === 'all' || card.dataset.cat === activeCat;
      const matchesText = !q || card.dataset.name.includes(q);
      const show = matchesCat && matchesText;
      card.classList.toggle('hidden', !show);
      if (show){ visibleInSection++; totalVisible++; }
    });
    sec.classList.toggle('hidden', visibleInSection === 0);
  });
  resultCountEl.textContent = `Mostrando ${totalVisible} de ${data.length} publicaciones`;
}

searchInput.addEventListener('input', applyFilters);

filterPillsEl.addEventListener('click', (e) => {
  const pill = e.target.closest('.pill');
  if (!pill) return;
  activeCat = pill.dataset.cat;
  filterPillsEl.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p === pill));
  applyFilters();
});

applyFilters();

/* ---------------- COPY LOGIC ---------------- */
function showToast(){
  const t = document.getElementById('toast');
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 1300);
}

function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand('copy'); done(); } catch(e){}
  document.body.removeChild(ta);
}

function copyToClipboard(text, btn){
  function done(){
    if (!btn.dataset.label) btn.dataset.label = btn.innerHTML;
    btn.classList.add('copied');
    btn.innerHTML = btn.classList.contains('btn-copy') ? (COPY_ICON + ' ✓ Copiado') : COPY_ICON;
    showToast();
    clearTimeout(btn._t);
    btn._t = setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = btn.dataset.label;
    }, 1300);
  }
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function selectAllText(el){
  if (window.getSelection && document.createRange){
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
}

document.addEventListener('click', (e) => {
  const copyBtn = e.target.closest('[data-copy]');
  if (copyBtn){
    const text = decodeURIComponent(copyBtn.getAttribute('data-copy'));
    copyToClipboard(text, copyBtn);
    return;
  }
  const block = e.target.closest('.copyable');
  if (block) selectAllText(block);
});

/* ---------------- BACK TO TOP ---------------- */
const toTopBtn = document.getElementById('toTop');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
window.addEventListener('scroll', () => {
  toTopBtn.classList.toggle('show', window.scrollY > 500);
});
toTopBtn.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
});
</script>
